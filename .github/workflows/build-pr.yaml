name: build-pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ser-pounce/rood-reverse'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/ser-pounce/rood-reverse:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build, verify, and check formatting
        run: |
          make commit-check -j"$(nproc)" DISKIMAGE=/SLUS-01040.bin
          git diff --exit-code
